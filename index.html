<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVALIAÇÃO ETAPA 2 - SISTEMAS DISTRIBUÍDOS</title>
<!-- Bootstrap CSS (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#181c22;
    --line:#2a2f38;
    --text:#e6e4dd;
    --muted:#8b93a1;
    --amber:#f89820;
    --teal:#4b9cd3;
    --ok:#5fa777;
    --err:#c4574a;
    --mono: "JetBrains Mono","Fira Code",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(75,156,211,.13), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(248,152,32,.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .term{
    width:100%;
    max-width:640px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:#1d222a;
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.02em;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#3a3f48;}
  .titlebar span.path{margin-left:6px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0 0 10px 10px;
    padding:28px 26px 24px;
  }
  .prompt{
    color:var(--teal);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .prompt b{color:var(--amber);font-weight:600;}
  .quiz-progress{
    display:flex;
    gap:6px;
    margin:14px 0 22px;
  }
  .seg{
    height:4px;
    flex:1;
    background:#262b33;
    border-radius:2px;
    overflow:hidden;
  }
  .seg i{display:block;height:100%;width:0%;background:var(--teal);transition:width .25s ease;}
  .seg.done i{width:100%;background:var(--amber);}
  .seg.current i{width:100%;background:var(--teal);}
  h2.q{
    font-size:17px;
    line-height:1.55;
    font-weight:500;
    margin:0 0 20px;
    color:var(--text);
  }
  h2.q::before{content:"$ ";color:var(--amber);}
  .options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .opt{
    border:1px solid var(--line);
    background:#14181e;
    border-radius:7px;
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    cursor:pointer;
    font-size:14px;
    line-height:1.5;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .opt:hover{border-color:var(--teal);background:#171c23;}
  .opt:active{transform:scale(.997);}
  .opt .k{
    color:var(--muted);
    font-weight:600;
    min-width:1.4em;
  }
  .opt.correct{border-color:var(--ok);background:rgba(95,167,119,.10);}
  .opt.correct .k{color:var(--ok);}
  .opt.wrong{border-color:var(--err);background:rgba(196,87,74,.10);}
  .opt.wrong .k{color:var(--err);}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.55;}
  .feedback{
    margin-top:16px;
    padding:12px 14px;
    border-radius:7px;
    font-size:13px;
    line-height:1.6;
    border:1px solid var(--line);
    background:#0f1318;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback .tag{
    font-weight:600;
    margin-right:6px;
  }
  .feedback.ok .tag{color:var(--ok);}
  .feedback.bad .tag{color:var(--err);}
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .score{color:var(--muted);font-size:12px;}
  .score b{color:var(--text);}
  button{
    font-family:var(--mono);
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    transition:.12s ease;
  }
  button.next{
    border-color:var(--amber);
    color:var(--amber);
    visibility:hidden;
  }
  button.next.show{visibility:visible;}
  button.next:hover{background:rgba(232,163,61,.10);}
  button:disabled{opacity:.4;cursor:default;}
  .end{text-align:center;padding:10px 4px 4px;}
  .end .big{font-size:38px;color:var(--amber);margin:6px 0 2px;}
  .end p{color:var(--muted);font-size:13px;margin:4px 0 22px;}
  .end .actions{display:flex;gap:10px;justify-content:center;}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--amber);margin-left:2px;vertical-align:-2px;animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  /* tela inicial */
  .setup-label{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px;}
  .opt.selected{border-color:var(--amber);background:rgba(248,152,32,.07);}
  .opt.selected .k{color:var(--amber);}
  .opt .count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;}
  .qty{display:flex;gap:8px;flex-wrap:wrap;}
  .qty button{flex:1;min-width:64px;}
  .qty button.active{border-color:var(--teal);color:var(--teal);background:rgba(75,156,211,.10);}
  .start-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
  .start-row .avail{color:var(--muted);font-size:12px;}
  .start-row .avail b{color:var(--text);}
  button.go{border-color:var(--amber);color:var(--amber);}
  button.go:hover{background:rgba(232,163,61,.10);}
  .seg.bar i{background:var(--amber);}
  @media (max-width: 600px){
    .qty button{width:auto;}
    .start-row{flex-direction:column;align-items:stretch;}
  }
  /* tela inicial */
  .setup-label{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px;}
  .opt.selected{border-color:var(--amber);background:rgba(248,152,32,.07);}
  .opt.selected .k{color:var(--amber);}
  .opt .count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;}
  .qty{display:flex;gap:8px;flex-wrap:wrap;}
  .qty button{flex:1;min-width:64px;}
  .qty button.active{border-color:var(--teal);color:var(--teal);background:rgba(75,156,211,.10);}
  .start-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;}
  .start-row .avail{color:var(--muted);font-size:12px;}
  .start-row .avail b{color:var(--text);}
  button.go{border-color:var(--amber);color:var(--amber);}
  button.go:hover{background:rgba(232,163,61,.10);}
  .seg.bar i{background:var(--amber);}
  @media (max-width: 600px){
    .qty button{width:auto;}
    .start-row{flex-direction:column;align-items:stretch;}
  }
  /* revisao das questoes erradas */
  .review{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    border:1px solid var(--err);background:rgba(196,87,74,.07);border-radius:8px;padding:12px 14px;margin-top:14px;}
  .review .msg{font-size:13px;color:var(--text);}
  .review .msg b{color:var(--err);}
  .review .acts{display:flex;gap:8px;}
  button.clear{color:var(--muted);}
  .end .actions{flex-wrap:wrap;}
  .end .saved{font-size:12px;margin-top:-14px;}
  @media (max-width: 600px){
    .review .acts{width:100%;flex-direction:column;}
    .end .actions{flex-direction:column;}
  }
  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;}
    .opt,.seg i{transition:none;}
  }
</style>
<!-- Mobile responsive tweaks -->
<style>
  @media (max-width: 600px){
    body{padding:18px 10px;}
    .term{max-width:100%;}
    .panel{padding:16px;}
    .titlebar{padding:8px 10px;font-size:11px;}
    .prompt{font-size:11px}
    h2.q{font-size:15px}
    .opt{padding:10px; font-size:14px}
    .quiz-progress{margin:10px 0}
    .seg{height:3px}
    .footer{flex-direction:column;align-items:flex-start;gap:10px}
    .footer .score{font-size:13px}
    button{width:100%}
    .end .big{font-size:34px}
  }
</style>
</head>

    <div class="dot"></div><div class="dot"></div><div class="dot"></div>

  </div>
  <div class="panel">
    <p class="prompt">AVALIAÇÃO ETAPA 2 - SISTEMAS DISTRIBUÍDOS · <b id="topic">Sistemas Distribuídos</b></p>
    <div class="quiz-progress" id="progress"></div>

    <div id="quizArea"></div>

    <div class="footer" id="footer" style="display:none;">
      <div class="score">Questão <b id="qNum">1</b>/<span id="qTotal">0</span> · Acertos: <b id="scoreVal">0</b>/<span id="scoreTotal">0</span></div>
      <button class="next btn btn-outline-warning" id="nextBtn">próxima →</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {
    topic: "Introdução a SDs",
    question: "Qual sequência representa corretamente a evolução histórica dos sistemas computacionais apresentada (1960 → 2010)?",
    options: { A: "Mainframes → Cliente-servidor → LANs → Internet → Microsserviços → Cloud", B: "LANs → Mainframes → Cliente-servidor → Cloud → Internet → Microsserviços", C: "Mainframes → LANs → Cliente-servidor → Internet → Cloud → Microsserviços", D: "Mainframes → LANs → Internet → Cliente-servidor → Cloud → Microsserviços", E: "Cliente-servidor → Mainframes → LANs → Internet → Microsserviços → Cloud" },
    answer: "C",
    explain: "A linha do tempo do slide é: 1960 Mainframes, 1970 LANs, 1980 Cliente-servidor, 1990 Internet, 2000 Cloud e 2010 Microsserviços."
  },
  {
    topic: "Introdução a SDs",
    question: "Na linha do tempo da evolução histórica, qual par década–marco está correto?",
    options: { A: "1960 – Cliente-servidor", B: "1990 – Cloud", C: "2000 – Microsserviços", D: "1970 – LANs", E: "1980 – Internet" },
    answer: "D",
    explain: "1970 corresponde às LANs. Cliente-servidor é 1980, Internet 1990, Cloud 2000 e Microsserviços 2010."
  },
  {
    topic: "Introdução a SDs",
    question: "Qual definição de Sistema Distribuído é atribuída a Tanenbaum & Van Steen (2007)?",
    options: { A: "Camada de software posicionada entre as aplicações e o sistema operacional", B: "Computadores independentes que se apresentam ao usuário como um sistema único e coerente", C: "Computadores homogêneos interligados por uma rede local de alta velocidade", D: "Processos que compartilham a mesma memória física e um relógio global único", E: "Computadores localizados em rede que coordenam suas ações através de troca de mensagens" },
    answer: "B",
    explain: "Para Tanenbaum & Van Steen, um SD é uma coleção de computadores independentes que se apresentam ao usuário como um sistema único e coerente. A alternativa sobre troca de mensagens é a definição de Coulouris."
  },
  {
    topic: "Introdução a SDs",
    question: "Para Coulouris (2007), um sistema distribuído é aquele em que:",
    options: { A: "dispositivos móveis funcionam de forma autônoma e sem administração central", B: "os computadores estão em rede e coordenam suas ações por troca de mensagens", C: "um único nó central trata todas as requisições e todo o controle do sistema", D: "os componentes compartilham um mesmo repositório de dados centralizado", E: "computadores independentes se apresentam como um sistema único e coerente" },
    answer: "B",
    explain: "A definição de Coulouris enfatiza a localização dos computadores em rede e a coordenação por troca de mensagens. A ideia de sistema único e coerente é de Tanenbaum & Van Steen."
  },
  {
    topic: "Introdução a SDs",
    question: "Segundo o material, o que define um sistema distribuído é a combinação de:",
    options: { A: "memória física compartilhada entre as máquinas com um relógio global único", B: "hardware homogêneo em todos os nós com o mesmo sistema operacional instalado", C: "processamento estritamente sequencial com armazenamento replicado em vários nós", D: "centralização do hardware (um único servidor) com distribuição do software entre clientes", E: "autonomia de hardware (máquinas independentes) com cooperação de software" },
    answer: "E",
    explain: "O slide destaca que a combinação de autonomia de hardware (máquinas independentes) com cooperação de software (comunicação coordenada) é o que define um SD."
  },
  {
    topic: "Introdução a SDs",
    question: "Para o usuário e internamente, um sistema distribuído é descrito, respectivamente, como:",
    options: { A: "um sistema que expõe sua distribuição; internamente, um sistema totalmente centralizado", B: "um conjunto de terminais independentes; internamente, um mainframe que processa tudo", C: "um conjunto de máquinas visível ao usuário; internamente, um único servidor central", D: "a transparência de um sistema centralizado; internamente, várias máquinas coordenadas", E: "uma interface única e simples; internamente, uma única aplicação monolítica em um host" },
    answer: "D",
    explain: "Para o usuário, o SD oferece a transparência de um sistema centralizado; internamente, é um conjunto complexo de máquinas que trabalham juntas, coordenando-se para atingir um objetivo comum."
  },
  {
    topic: "Introdução a SDs",
    question: "De acordo com a definição de “Comunicação por mensagens”, a comunicação entre os componentes de um SD:",
    options: { A: "pode ser síncrona ou assíncrona, conforme a aplicação e a coordenação exigida", B: "depende de um relógio global único para ordenar todas as mensagens enviadas", C: "é sempre assíncrona, para evitar que um componente fique bloqueado aguardando", D: "é sempre síncrona, pois só assim é possível garantir a coordenação entre os nós", E: "ocorre por memória compartilhada entre as máquinas, dispensando o uso da rede" },
    answer: "A",
    explain: "O material afirma que as mensagens podem ser enviadas de forma síncrona ou assíncrona, conforme a necessidade da aplicação e o nível de coordenação exigido."
  },
  {
    topic: "Introdução a SDs",
    question: "Por que a descentralização é considerada uma característica-chave dos sistemas distribuídos?",
    options: { A: "Porque dispensa a troca de mensagens entre os componentes do sistema", B: "Porque garante que todos os nós possuam exatamente o mesmo hardware", C: "Porque elimina o ponto único de falha, mantendo o sistema funcionando", D: "Porque torna a distribuição visível, facilitando a depuração pelo usuário", E: "Porque concentra o controle em um nó, simplificando a aplicação da segurança" },
    answer: "C",
    explain: "A descentralização elimina o ponto único de falha, permitindo que o sistema continue funcionando mesmo com a falha de um componente."
  },
  {
    topic: "Introdução a SDs",
    question: "Na definição de “Trabalho Colaborativo”, os sistemas distribuídos são projetados para:",
    options: { A: "que vários dispositivos em rede cooperem por um objetivo comum, tolerando falhas", B: "que cada dispositivo persiga um objetivo próprio, independente dos demais nós", C: "isolar cada dispositivo, evitando qualquer comunicação entre eles na rede", D: "executar uma tarefa por vez em um único computador de alta capacidade", E: "substituir a rede por um barramento de memória compartilhada entre os nós" },
    answer: "A",
    explain: "Trabalho colaborativo: múltiplos dispositivos trabalham juntos para um objetivo comum, em ambiente de rede, onde falhas de um ou mais componentes não afetam o sistema como um todo."
  },
  {
    topic: "Introdução a SDs",
    question: "Qual é o objetivo da característica Transparência em um SD?",
    options: { A: "Integrar sistemas de fornecedores diferentes por meio de padrões abertos", B: "Expor a localização dos recursos para que o usuário otimize o próprio acesso", C: "Permitir que vários processos executem simultaneamente compartilhando recursos", D: "Permitir que o sistema cresça em usuários sem perda significativa de desempenho", E: "Simplicidade para o usuário, com a complexidade gerenciada pelo sistema" },
    answer: "E",
    explain: "A transparência oculta a natureza distribuída do sistema. O objetivo citado é: simplicidade para o usuário, complexidade gerenciada pelo sistema."
  },
  {
    topic: "Introdução a SDs",
    question: "Quais são as três dimensões da escalabilidade apresentadas no material?",
    options: { A: "Lógica, física e temporal", B: "Tamanho, geográfica e administrativa", C: "Interoperabilidade, extensibilidade e flexibilidade", D: "Disponibilidade, segurança e recuperabilidade", E: "Vertical, horizontal e diagonal" },
    answer: "B",
    explain: "Escalabilidade: crescer sem degradação significativa em tamanho (mais usuários/recursos), geográfica (grandes distâncias) e administrativa (múltiplas organizações independentes)."
  },
  {
    topic: "Introdução a SDs",
    question: "Um sistema precisa passar a abranger várias organizações independentes, cada uma com suas próprias políticas, sem perder desempenho. Qual dimensão de escalabilidade está envolvida?",
    options: { A: "Geográfica", B: "De tamanho", C: "Administrativa", D: "Temporal", E: "Vertical" },
    answer: "C",
    explain: "A escalabilidade administrativa trata de abranger múltiplas organizações independentes."
  },
  {
    topic: "Introdução a SDs",
    question: "Um serviço precisa funcionar eficientemente para usuários espalhados em continentes diferentes. Qual dimensão de escalabilidade está em foco?",
    options: { A: "Administrativa", B: "Abertura", C: "Recuperabilidade", D: "Geográfica", E: "De tamanho" },
    answer: "D",
    explain: "A escalabilidade geográfica é a capacidade de funcionar eficientemente em grandes distâncias."
  },
  {
    topic: "Introdução a SDs",
    question: "Quais desafios são citados para a escalabilidade de um SD?",
    options: { A: "Condição de corrida, deadlock e proteção da seção crítica", B: "Amarração a fornecedor, falta de padrões e incompatibilidade de hardware", C: "Latência de rede, sincronização e heterogeneidade administrativa", D: "Atomicidade, consistência e durabilidade das transações", E: "Ponto único de falha, gargalo e alto custo de supercomputadores" },
    answer: "C",
    explain: "O slide de escalabilidade lista como desafios: latência de rede, sincronização e heterogeneidade administrativa."
  },
  {
    topic: "Introdução a SDs",
    question: "A analogia do hub USB (aceita diferentes dispositivos, mas com o mesmo padrão de comunicação) ilustra qual característica dos SDs?",
    options: { A: "Concorrência", B: "Escalabilidade", C: "Transparência", D: "Abertura", E: "Confiabilidade" },
    answer: "D",
    explain: "Abertura é a capacidade de ser estendido e integrado a outros sistemas através de padrões bem definidos, como o hub USB."
  },
  {
    topic: "Introdução a SDs",
    question: "Dentro da característica Abertura, a “adição facilitada de novos componentes” corresponde a:",
    options: { A: "Flexibilidade", B: "Escalabilidade de tamanho", C: "Extensibilidade", D: "Recuperabilidade", E: "Interoperabilidade" },
    answer: "C",
    explain: "Abertura envolve interoperabilidade (conexão de sistemas diferentes), extensibilidade (adição de componentes) e flexibilidade (tecnologias diferentes juntas)."
  },
  {
    topic: "Introdução a SDs",
    question: "Qual benefício é associado à característica Abertura?",
    options: { A: "Evitar a “amarração” a uma única tecnologia ou fornecedor", B: "Melhor utilização de recursos e menor tempo de resposta", C: "Garantir um relógio global único para a sincronização", D: "Ocultar do usuário a localização física dos recursos", E: "Eliminar a latência de rede entre nós geograficamente distantes" },
    answer: "A",
    explain: "O benefício da abertura é evitar a amarração (lock-in) a uma única tecnologia ou fornecedor."
  },
  {
    topic: "Introdução a SDs",
    question: "Dentro da Confiabilidade, qual aspecto descreve a capacidade de se recuperar de falhas (pós-falha)?",
    options: { A: "Recuperabilidade", B: "Segurança", C: "Tolerância a falhas", D: "Disponibilidade", E: "Extensibilidade" },
    answer: "A",
    explain: "Recuperabilidade é a capacidade de se recuperar de falhas (pós-falha). Tolerância a falhas é a operação parcial durante a falha."
  },
  {
    topic: "Introdução a SDs",
    question: "O aspecto da Confiabilidade que permite “operação parcial em caso de falhas” é:",
    options: { A: "Tolerância a falhas", B: "Segurança", C: "Transparência", D: "Disponibilidade", E: "Recuperabilidade" },
    answer: "A",
    explain: "Tolerância a falhas = o sistema continua operando parcialmente mesmo com componentes falhando."
  },
  {
    topic: "Introdução a SDs",
    question: "No contexto da Confiabilidade, o aspecto Segurança é definido como:",
    options: { A: "capacidade de se recuperar depois de uma falha", B: "criptografia de todas as mensagens trocadas na rede", C: "controle de acesso concorrente aos recursos", D: "o sistema permanecer utilizável pelos usuários", E: "proteção contra falhas catastróficas" },
    answer: "E",
    explain: "Nos aspectos de confiabilidade, Segurança é a proteção contra falhas catastróficas; disponibilidade é permanecer utilizável."
  },
  {
    topic: "Introdução a SDs",
    question: "Qual dos itens abaixo NÃO é um aspecto da Confiabilidade listado no material?",
    options: { A: "Tolerância a falhas", B: "Disponibilidade", C: "Recuperabilidade", D: "Interoperabilidade", E: "Segurança" },
    answer: "D",
    explain: "Interoperabilidade é um aspecto da Abertura. Os aspectos de Confiabilidade são disponibilidade, segurança, tolerância a falhas e recuperabilidade."
  },
  {
    topic: "Introdução a SDs",
    question: "Os servidores NTP são citados no material em relação a qual desafio da Concorrência?",
    options: { A: "Compartilhamento seguro de recursos", B: "Controle de acesso concorrente aos dados", C: "Ausência de relógio global para sincronização", D: "Heterogeneidade administrativa entre organizações", E: "Latência causada pela distância geográfica" },
    answer: "C",
    explain: "Em SDs não existe um relógio global; servidores NTP são usados para sincronizar os relógios das máquinas."

DATA.push(...EASY);


// ---- estado ----
let order = [];      // ordem embaralhada das perguntas (indices em DATA)
let current = 0;
let score = 0;
let answered = false;
let mode = 'normal';  // 'normal' ou 'review' (refazendo as erradas)
let roundWrong = [];  // indices (em DATA) errados na rodada atual

// ---- memoria de erros ----
// Fica no localStorage do navegador: cada pessoa/navegador que abre a pagina
// tem a sua propria lista. A chave e o texto da pergunta (estavel mesmo se a
// ordem de DATA mudar). Acertar a questao depois a remove da lista.
const WRONG_KEY = 'sd-quiz:erros:v1';
let wrongMem = {};    // copia em memoria (usada se o localStorage estiver bloqueado)

function loadWrong(){
  try{
    const raw = localStorage.getItem(WRONG_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    wrongMem = obj && typeof obj === 'object' ? obj : {};
  }catch(e){ /* sem storage: segue com a copia em memoria */ }
  return wrongMem;
}
function saveWrong(obj){
  wrongMem = obj;
  try{ localStorage.setItem(WRONG_KEY, JSON.stringify(obj)); }catch(e){}
}
function markWrong(q){
  const w = loadWrong();
  const prev = w[q.question];
  w[q.question] = { count: (prev ? prev.count : 0) + 1, last: Date.now() };
  saveWrong(w);
}
function markRight(q){
  const w = loadWrong();
  if(w[q.question]){ delete w[q.question]; saveWrong(w); }
}
function clearWrong(){ saveWrong({}); }
// indices em DATA das questoes erradas salvas (sem repetir a mesma pergunta)
function wrongPool(){
  const w = loadWrong();
  const seen = new Set();
  return DATA.map((q, i) => i).filter(i => {
    const t = DATA[i].question;
    if(!w[t] || seen.has(t)) return false;
    seen.add(t);
    return true;
  });
}

// configuracao da rodada (tela inicial)
const TOPICS = [...new Set(DATA.map(q => q.topic))];
const QTY_OPTIONS = [10, 20, 30, 'todas'];
// o tema "50 Mais Fáceis" repete questões dos outros temas, por isso vem desmarcado
let selectedTopics = new Set(TOPICS.filter(t => t !== EASY_TOPIC));
let selectedQty = 10;

const topicEl = document.getElementById('topic');
const progressEl = document.getElementById('progress');
const quizArea = document.getElementById('quizArea');
const footer = document.getElementById('footer');
const scoreVal = document.getElementById('scoreVal');
const scoreTotal = document.getElementById('scoreTotal');
const qNum = document.getElementById('qNum');
const qTotal = document.getElementById('qTotal');
const nextBtn = document.getElementById('nextBtn');

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// indices das questoes dos temas selecionados, sem repetir a mesma pergunta
// (as do tema "50 Mais Fáceis" sao copias das dos outros temas)
function selectedPool(){
  const seen = new Set();
  return DATA.map((q, i) => i).filter(i => {
    const q = DATA[i];
    if(!selectedTopics.has(q.topic) || seen.has(q.question)) return false;
    seen.add(q.question);
    return true;
  });
}

function availableCount(){
  return selectedPool().length;
}

// ---- tela inicial: escolha de temas e quantidade ----
function renderStart(){
  footer.style.display = 'none';
  progressEl.innerHTML = '';
  topicEl.textContent = 'Sistemas Distribuídos';
  quizArea.innerHTML = '';

  const h = document.createElement('h2');
  h.className = 'q';
  h.textContent = 'Escolha os temas e a quantidade de questões';
  quizArea.appendChild(h);

  // questoes erradas salvas neste navegador
  const pending = wrongPool();
  if(pending.length){
    const box = document.createElement('div');
    box.className = 'review';
    const n = pending.length;
    box.innerHTML = `<span class="msg">Você tem <b>${n}</b> ${n === 1 ? 'questão errada salva' : 'questões erradas salvas'}.</span>`;
    const acts = document.createElement('div');
    acts.className = 'acts';
    const redo = document.createElement('button');
    redo.className = 'go';
    redo.textContent = 'refazer erradas →';
    redo.addEventListener('click', () => startReview(wrongPool()));
    const clr = document.createElement('button');
    clr.className = 'clear';
    clr.textContent = 'limpar';
    clr.addEventListener('click', () => {
      if(confirm('Apagar a lista de questões erradas salvas?')){ clearWrong(); renderStart(); }
    });
    acts.appendChild(redo);
    acts.appendChild(clr);
    box.appendChild(acts);
    quizArea.appendChild(box);
  }

  const lblT = document.createElement('p');
  lblT.className = 'setup-label';
  lblT.textContent = 'temas';
  quizArea.appendChild(lblT);

  const ul = document.createElement('ul');
  ul.className = 'options';
  TOPICS.forEach(t => {
    const li = document.createElement('li');
    const n = DATA.filter(q => q.topic === t).length;
    const paint = () => {
      const on = selectedTopics.has(t);
      li.className = 'opt' + (on ? ' selected' : '');
      const note = t === EASY_TOPIC ? ' <small>(conteúdos misturados · repete questões dos outros temas)</small>' : '';
      li.innerHTML = `<span class="k">${on ? '■' : '□'}</span><span>${t}${note}</span><span class="count">${n} questões</span>`;
    };
    paint();
    li.addEventListener('click', () => {
      if(selectedTopics.has(t)) selectedTopics.delete(t); else selectedTopics.add(t);
      paint();
      updateAvail();
    });
    ul.appendChild(li);
  });
  quizArea.appendChild(ul);

  const lblQ = document.createElement('p');
  lblQ.className = 'setup-label';
  lblQ.textContent = 'questões por rodada';
  quizArea.appendChild(lblQ);

  const qty = document.createElement('div');
  qty.className = 'qty';
  QTY_OPTIONS.forEach(v => {
    const b = document.createElement('button');
    b.textContent = v;
    if(v === selectedQty) b.classList.add('active');
    b.addEventListener('click', () => {
      selectedQty = v;
      qty.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      updateAvail();
    });
    qty.appendChild(b);
  });
  quizArea.appendChild(qty);

  const row = document.createElement('div');
  row.className = 'start-row';
  row.innerHTML = '<div class="avail" id="avail"></div>';
  const go = document.createElement('button');
  go.className = 'go';
  go.id = 'goBtn';
  go.textContent = 'iniciar →';
  go.addEventListener('click', () => { if(availableCount() > 0) startQuiz(); });
  row.appendChild(go);
  quizArea.appendChild(row);

  updateAvail();
}

function updateAvail(){
  const total = availableCount();
  const n = selectedQty === 'todas' ? total : Math.min(selectedQty, total);
  const el = document.getElementById('avail');
  const go = document.getElementById('goBtn');
  if(!el || !go) return;
  el.innerHTML = total === 0
    ? 'Selecione ao menos um tema.'
    : `Rodada: <b>${n}</b> de ${total} questões disponíveis`;
  go.disabled = total === 0;
}

// ---- quiz ----
function buildProgress(){
  progressEl.innerHTML = '';
  if(order.length > 30){
    // muitas questoes: uma barra continua no lugar dos segmentos
    const seg = document.createElement('div');
    seg.className = 'seg bar';
    seg.innerHTML = `<i style="width:${(current / order.length) * 100}%"></i>`;
    progressEl.appendChild(seg);
    return;
  }
  order.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg' + (i < current ? ' done' : i === current ? ' current' : '');
    seg.innerHTML = '<i></i>';
    progressEl.appendChild(seg);
  });
}

function startQuiz(){
  const shuffled = shuffle(selectedPool());
  startRound(selectedQty === 'todas' ? shuffled : shuffled.slice(0, Math.min(selectedQty, shuffled.length)), 'normal');
}

// rodada so com questoes erradas (todas as salvas, ou as da ultima rodada)
function startReview(indices){
  if(!indices.length) return;
  startRound(shuffle(indices), 'review');
}

function startRound(indices, m){
  mode = m;
  order = indices;
  roundWrong = [];
  current = 0;
  score = 0;
  scoreTotal.textContent = order.length;
  qTotal.textContent = order.length;
  footer.style.display = 'flex';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  nextBtn.classList.remove('show');
  const q = DATA[order[current]];
  topicEl.textContent = (mode === 'review' ? 'Revisão · ' : '') + (q.from ? `${q.topic} · ${q.from}` : q.topic);
  buildProgress();
  scoreVal.textContent = score;
  qNum.textContent = current + 1;
  // embaralha as opcoes a cada renderizacao
  const letters = Object.keys(q.options);
  const shuffledLetters = shuffle(letters);

  quizArea.innerHTML = '';

  const h = document.createElement('h2');
  h.className = 'q';
  h.textContent = q.question;
  quizArea.appendChild(h);

  const ul = document.createElement('ul');
  ul.className = 'options';

  shuffledLetters.forEach((origLetter, idx) => {
    const li = document.createElement('li');
    li.className = 'opt';
    const displayLetter = String.fromCharCode(65 + idx); // A, B, C, D na nova posicao
    li.innerHTML = `<span class="k">${displayLetter}</span><span>${q.options[origLetter]}</span>`;
    li.dataset.orig = origLetter;
    li.addEventListener('click', () => selectOption(li, origLetter, q));
    ul.appendChild(li);
  });

  quizArea.appendChild(ul);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';
  quizArea.appendChild(fb);
}

function selectOption(li, origLetter, q){
  if(answered) return;
  answered = true;

  const allOpts = quizArea.querySelectorAll('.opt');
  const isCorrect = origLetter === q.answer;

  allOpts.forEach(opt => {
    opt.classList.add('disabled');
    if(opt.dataset.orig === q.answer){
      opt.classList.add('correct');
    } else if(opt === li && !isCorrect){
      opt.classList.add('wrong');
    } else {
      opt.classList.add('dim');
    }
  });

  if(isCorrect){
    score++;
    markRight(q);
  } else {
    roundWrong.push(order[current]);
    markWrong(q);
  }
  scoreVal.textContent = score;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<span class="tag">${isCorrect ? 'Correto.' : 'Incorreto.'}</span>${q.explain}`;

  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  if(!answered) return;
  current++;
  if(current < order.length){
    renderQuestion();
  } else {
    renderEnd();
  }
});

function renderEnd(){
  footer.style.display = 'none';
  buildProgress();
  document.querySelectorAll('.seg').forEach(s => s.classList.add('done'));
  const pct = Math.round((score / order.length) * 100);
  const missed = roundWrong.slice();
  const saved = wrongPool().length;
  const savedMsg = saved === 0
    ? 'Nenhuma questão errada pendente.'
    : `${saved} ${saved === 1 ? 'questão errada salva' : 'questões erradas salvas'} para revisão.`;
  quizArea.innerHTML = `
    <div class="end">
      <p class="prompt">${mode === 'review' ? 'Revisão finalizada' : 'Quiz finalizado'}<span class="cursor"></span></p>
      <div class="big">${score}/${order.length}</div>
      <p>${pct}% de acerto</p>
      <p class="saved">${savedMsg}</p>
      <div class="actions">
        ${missed.length ? `<button id="redoWrongBtn" class="go">refazer erradas (${missed.length})</button>` : ''}
        <button id="restartBtn">${mode === 'review' ? 'refazer revisão' : 'nova rodada'}</button>
        <button id="menuBtn">menu</button>
      </div>
    </div>
  `;
  const prevOrder = order.slice();
  const prevMode = mode;
  if(missed.length){
    document.getElementById('redoWrongBtn').addEventListener('click', () => startReview(missed));
  }
  document.getElementById('restartBtn').addEventListener('click', () => {
    if(prevMode === 'review') startReview(prevOrder); else startQuiz();
  });
  document.getElementById('menuBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
</body>
</html>
